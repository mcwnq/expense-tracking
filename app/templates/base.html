<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Expense Tracker{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <strong>Trader Expense Tracker</strong>
  <a href="/summary">Summary</a>
  <a href="/">Cards</a>
  <a href="/import">Import CSV</a>
  <a href="/imports">Imports</a>
  <a href="/transactions">Transactions</a>
  <a href="/vendors">Vendors</a>
  <a href="/formats">CSV formats</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
// Saving a change reloads the page; come back to the same scroll position instead of the top.
try {
  const key = "scroll:" + location.pathname + location.search;
  const saved = sessionStorage.getItem(key);
  if (saved !== null) {
    sessionStorage.removeItem(key);
    window.addEventListener("load", () => window.scrollTo(0, +saved));
  }
  document.addEventListener("submit", e => {
    if (e.target.method.toLowerCase() !== "post") return;
    const back = e.target.querySelector("input[name=back]");
    const url = back ? new URL(back.value, location.href) : location;
    sessionStorage.setItem("scroll:" + url.pathname + url.search, String(window.scrollY));
  });
} catch (err) {}
</script>
</body>
</html>
